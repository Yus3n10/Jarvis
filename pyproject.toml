[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
# The voice + conversation layer. Runs on the Pi, not needed for the pure-core tests.
# openWakeWord uses the onnx backend (tflite-runtime is broken under numpy 2).
voice = [
    "openwakeword>=0.6",
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "onnxruntime>=1.20",
    "google-genai>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
